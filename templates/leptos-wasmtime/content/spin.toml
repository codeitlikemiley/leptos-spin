spin_manifest_version = 2

[application]
name = "{{project-name | kebab_case}}"
version = "0.1.0"
authors = ["{{authors}}"]
description = "Standard Leptos WASI app for Wasmtime or Spin. No composed middleware and no trusted ingress."

# Profile 1 of 3: the component serves the application itself.
# CORS, browser security headers, and authentication are not configured here.
# Opt into spin.middleware.toml or spin.trusted-ingress.toml, never both.
[[trigger.http]]
route = "/..."
component = "{{project-name | kebab_case}}"
executor = { type = "http" }

[component.{{project-name | kebab_case}}]
source = "target/wasm32-wasip2/release/{{project-name | snake_case}}.wasm"
allowed_outbound_hosts = []
files = [{ source = "target/site", destination = "/site" }]
[component.{{project-name | kebab_case}}.environment]
LEPTOS_OUTPUT_NAME = "{{project-name | snake_case}}"
LEPTOS_SITE_ROOT = "/site"
LEPTOS_SITE_PKG_DIR = "pkg"
[component.{{project-name | kebab_case}}.build]
command = "cargo leptos build --release --frontend-only && LEPTOS_OUTPUT_NAME={{project-name | snake_case}} cargo build --lib --target wasm32-wasip2 --release --no-default-features --features ssr"
watch = ["src/**/*.rs", "Cargo.toml"]

# Browser assets stay on their own trigger so a later middleware or ingress
# policy can exempt them without wrapping this fileserver in auth.
[[trigger.http]]
route = "/pkg/..."
component = "{{project-name | kebab_case}}-pkg"

[component.{{project-name | kebab_case}}-pkg]
source = { url = "https://github.com/fermyon/spin-fileserver/releases/download/v0.1.0/spin_static_fs.wasm", digest = "sha256:96c76d9af86420b39eb6cd7be5550e3cb5d4cc4de572ce0fd1f6a29471536cb4" }
files = [{ source = "target/site/pkg", destination = "/" }]
environment = { CACHE_CONTROL = "no-cache" }
