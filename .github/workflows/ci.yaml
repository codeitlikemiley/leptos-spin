name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  generated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown

      - name: Install cargo-binstall
        run: curl -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install cargo-leptos 0.3.7 and wasm-bindgen-cli 0.2.129
        run: cargo binstall -y cargo-leptos@0.3.7 wasm-bindgen-cli@0.2.129

      - name: Install Spin 4.2.5
        run: |
          curl -fsSL -o /tmp/spin.tgz https://github.com/spinframework/spin/releases/download/v4.2.5/spin-v4.2.5-linux-amd64.tar.gz
          sudo tar -xzf /tmp/spin.tgz -C /usr/local/bin spin
          spin --version

      - name: Generate, resolve, build, and serve both templates
        run: ./scripts/check-generated-app.sh
