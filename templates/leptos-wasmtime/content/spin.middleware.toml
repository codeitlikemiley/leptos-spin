spin_manifest_version = 2

[application]
name = "{{project-name | kebab_case}}-middleware"
version = "0.1.0"
authors = ["{{authors}}"]
description = "Opt-in Spin 4.2.5 native HTTP middleware around the standard component."

# Profile 2 of 3. `spin up` does not use this file.
# The guest is the standard `--features ssr` build. Spin composes the
# pipeline at load time from `dependencies.middleware`. Do not also plug
# those components with wac, and do not point this manifest at the HMAC
# ingress build: that profile already owns auth, CORS, and security headers.
#
# Order is outer to inner. A request walks the array front to back before
# the application component. `/pkg/...` is a separate trigger with no
# middleware, so client assets stay public.
[[trigger.http]]
route = "/..."
component = "{{project-name | kebab_case}}"
executor = { type = "http" }
dependencies.middleware = [
  { component = "{{project-name | kebab_case}}-request-id" },
  { component = "{{project-name | kebab_case}}-security-headers" },
  { component = "{{project-name | kebab_case}}-cors" },
  { component = "{{project-name | kebab_case}}-authn-policy" },
]

[component.{{project-name | kebab_case}}]
source = "target/wasm32-wasip2/release/{{project-name | snake_case}}.wasm"
allowed_outbound_hosts = []
files = [{ source = "target/site", destination = "/site" }]
[component.{{project-name | kebab_case}}.environment]
LEPTOS_OUTPUT_NAME = "{{project-name | snake_case}}"
LEPTOS_SITE_ROOT = "/site"
LEPTOS_SITE_PKG_DIR = "pkg"

# These Wasm files are not vendored. Build them from
# codeitlikemiley/wasi-http-middleware after that repo pins wasip3 =0.9.0.
# Commit 61b41995812220c69c4a10530efb0cd5f7522840 is still wasip3 0.7.0.
# Intended final target: a signed wasi-http-middleware 0.2.0 release.
# Each component must import and export wasi:http/handler@0.3.0.
[component.{{project-name | kebab_case}}-request-id]
source = "target/middleware/request-id.wasm"
allowed_outbound_hosts = []

[component.{{project-name | kebab_case}}-security-headers]
source = "target/middleware/security-headers.wasm"
allowed_outbound_hosts = []

[component.{{project-name | kebab_case}}-cors]
source = "target/middleware/cors.wasm"
allowed_outbound_hosts = []
[component.{{project-name | kebab_case}}-cors.environment]
WASI_MIDDLEWARE_CORS_ORIGINS = "http://127.0.0.1:3000"
WASI_MIDDLEWARE_CORS_METHODS = "GET,HEAD,POST"
WASI_MIDDLEWARE_CORS_HEADERS = "content-type,x-request-id"
WASI_MIDDLEWARE_CORS_ALLOW_CREDENTIALS = "false"

[component.{{project-name | kebab_case}}-authn-policy]
source = "target/middleware/authn-policy.wasm"
allowed_outbound_hosts = []

[[trigger.http]]
route = "/pkg/..."
component = "{{project-name | kebab_case}}-pkg"

[component.{{project-name | kebab_case}}-pkg]
source = { url = "https://github.com/fermyon/spin-fileserver/releases/download/v0.1.0/spin_static_fs.wasm", digest = "sha256:96c76d9af86420b39eb6cd7be5550e3cb5d4cc4de572ce0fd1f6a29471536cb4" }
files = [{ source = "target/site/pkg", destination = "/" }]
environment = { CACHE_CONTROL = "no-cache" }
